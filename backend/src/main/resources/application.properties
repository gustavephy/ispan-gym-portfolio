spring.application.name=backend

# 資料庫連線設定
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=ispan-proj-gymdb;encrypt=false;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA 設定
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# 篩選唯一索引等 ddl-auto 做不到的設定，已改由 SchemaFixupRunner 在啟動後執行

# ── 訂單 / 金流 ─────────────────────────────────────────────────────────
# 逾時未付款訂單自動取消：超過這個時間仍是 UNPAID 的訂單，由 StaleOrderCleanupScheduler
# 比照手動取消處理（還原庫存、退回優惠券）。ISO-8601 Duration 格式（PT30M = 30 分鐘）。
app.order.unpaid-ttl=${ORDER_UNPAID_TTL:PT30M}
# 清理排程的執行間隔
app.order.cleanup-interval=${ORDER_CLEANUP_INTERVAL:PT5M}
# 建單節流：同一會員每 window 內最多建立 max 筆訂單（擋狂建，重送另由 Idempotency-Key 處理）
app.order.rate-limit.max=${ORDER_RATE_LIMIT_MAX:10}
app.order.rate-limit.window=${ORDER_RATE_LIMIT_WINDOW:PT1M}

# 圖片上傳（商品／課程圖、教練頭像）上限。Spring 預設 max-file-size 只有 1MB，
# 前端（utils/image.js、EmployeeProfileView）擋的是 5MB，兩邊要一致——相機拍的 jpg 動輒 3～5MB，
# 預設值下幾乎每張都被 MaxUploadSizeExceededException 擋掉，畫面只看到「上傳失敗」。
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# 模擬付款成功端點（POST /api/admin/orders/{id}/simulate-payment）：本機沒有對外 URL、
# 綠界的付款結果通知連不進來時，用這個把 UNPAID 訂單推進到已付款以展示整條流程。
# 走與真實付款成功完全相同的履約路徑，只是免簽章。
# 【提醒】正式環境務必設為 false（比照 app.seed.*）——上線後留著等於任何 ADMIN 都能無中生有把訂單標成已付款。
app.payment.simulate-enabled=${PAYMENT_SIMULATE_ENABLED:true}

# ── 開發模式開關 ─────────────────────────────────────────────────────────
# 【提醒】dev profile＝DevSecurityConfig 全 API 免登入＋DevCurrentUserProvider 固定假身分。
# 僅供本機開發：照此設定部署等於整個 API 無認證。部署／demo 前務必移除本行
# （或以環境變數 SPRING_PROFILES_ACTIVE 覆蓋），改走正式 JWT 鏈：
# 先 POST /api/auth/login 拿 token，之後請求帶 Authorization: Bearer <token>。
# 另注意：此預設也會滲入 @SpringBootTest 的 context，測真實安全鏈的測試
# 需覆寫 profile（見 JwtSecuritySmokeTest 的 @TestPropertySource）。
# 註解掉＝不指定 profile，@Profile("!dev") 的正式安全設定生效（JWT 驗證、真實登入身分）；
# 要回到本機免登入的全放行模式，把下一行取消註解即可（見 DevSecurityConfig 的啟動警告）。
# spring.profiles.active=dev

# dev 模式的假登入身分。DevCurrentUserProvider 的必要參數，註解掉會讓 dev 模式啟動失敗。
# 注意：dev profile 下前端登入誰都不影響後端，一律以這個 id 當登入者——
# 要測教練功能就得指到有 trainer 資料列的帳號，否則會一直收到「目前帳號沒有教練身分」。
# 對照 TestDataSeedRunner 的播種順序：1=種子管理員、2=wendy（純會員）、3=管理員、4=教練。
app.dev-current-user-id=4


# member_id／employee_id 與 account_id 已脫鉤為各自獨立流水號，彼此不一定同號；
# 沒特別設定時沿用 app.dev-current-user-id（見 DevCurrentUserProvider 的預設值語法），
# 要模擬「member_id 與 account_id 不同號」之類的情境時才需要打開並各自指定：
# app.dev-current-member-id=2
# app.dev-current-employee-id=3

# JWT 設定
# secret 需為 Base64、解碼後至少 32 bytes(256 bits)
# 下面的預設值僅供本機開發，解碼後即 "ispan-gym-local-dev-only-secret-do-not-use-in-prod!"
# 警告：此密鑰已進版控，任何人都能用它偽造任意帳號（含 ADMIN）的 token。
# 正式環境務必設定 JWT_SECRET 環境變數覆蓋，例如：
#   PowerShell> $env:JWT_SECRET=[Convert]::ToBase64String((1..32|%{Get-Random -Max 256}))
app.jwt.secret=${JWT_SECRET:aXNwYW4tZ3ltLWxvY2FsLWRldi1vbmx5LXNlY3JldC1kby1ub3QtdXNlLWluLXByb2Qh}
app.jwt.access-token-ttl=PT2H
app.jwt.issuer=ispan-gym

# CORS 允許的前端來源
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# 綠界 ECPay 金流設定
# merchant-id/hash-key/hash-iv 預設值是綠界官方公開給所有開發者共用的測試商店固定值，非機密。
# 正式環境務必用環境變數覆蓋為正式特店的值。
# 本機沒有對外公開的 URL，綠界無法主動打 return-url；開發階段改用 Postman 手動模擬通知，
# 打 /api/payments/ecpay/notify 驗證簽章與履約邏輯，之後要做真正端對端測試再用 ngrok 之類的工具覆蓋這個值。
# 註：綠界公開好幾組測試特店，後台模擬 3D 驗證（簡訊 OTP 1234）的行為不完全一樣；
# 這組 3002607 已實際驗證過 OTP 1234 可以正常過。
app.ecpay.merchant-id=${ECPAY_MERCHANT_ID:3002607}
app.ecpay.hash-key=${ECPAY_HASH_KEY:pwFHCqoQZGmho4w6}
app.ecpay.hash-iv=${ECPAY_HASH_IV:EkRm7iFT261dpevs}
app.ecpay.action-url=${ECPAY_ACTION_URL:https://payment-stage.ecpay.com.tw/Cashier/AioCheckOut/V5}
app.ecpay.return-url=${ECPAY_RETURN_URL:http://localhost:8080/api/payments/ecpay/notify}
# ATM／超商代碼取號結果通知（EcpayService#handlePaymentInfo）；跟 return-url 是不同的 callback，
# 本機同樣收不到綠界的呼叫，取號資訊要靠 ngrok 或前端從綠界頁面自行截圖才看得到，見該方法註解
app.ecpay.payment-info-url=${ECPAY_PAYMENT_INFO_URL:http://localhost:8080/api/payments/ecpay/payment-info}
# 主動查詢訂單付款結果（EcpayService#syncPaymentStatus）：本機收不到 return-url／payment-info-url 的
# 主動通知時，改由我方伺服器主動打這支官方查詢 API 問結果，不需要任何對外網址。
# 官方文件註明此 API 有頻率限制、不建議拿來輪詢，僅供使用者手動觸發時查詢一次。
app.ecpay.query-trade-info-url=${ECPAY_QUERY_TRADE_INFO_URL:https://payment-stage.ecpay.com.tw/Cashier/QueryTradeInfo/V5}
app.ecpay.client-back-url=${ECPAY_CLIENT_BACK_URL:http://localhost:5173/orders}

# Email 寄送設定（註冊驗證信用，密碼為 Gmail 應用程式密碼）
spring.mail.host=smtp.gmail.com
spring.mail.port=587
# 未設定環境變數時仍可啟動應用，僅寄信功能不可用
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# 註冊 Email 驗證：base-url 指向前端頁面（EmailVerificationView.vue），前端再用 GET
# 呼叫 /api/accounts/verify-email 並顯示結果——信件連結若直接指到這支後端 API，
# 使用者點開只會看到裸 JSON，不會顯示前端做的驗證結果頁。
app.mail.verification-base-url=${APP_VERIFICATION_BASE_URL:http://localhost:5173/verify-email}
app.mail.verification-token-ttl-minutes=10
app.mail.verification-resend-cooldown-minutes=1

# 忘記密碼／重設密碼：base-url 同樣指向前端頁面（前端再用 POST 把 token 連同新密碼送回後端，
# 跟 verification 用 GET 顯示結果的方式不同，因為這裡是要輸入新密碼而不是單純點擊確認）
app.mail.password-reset-base-url=${APP_PASSWORD_RESET_BASE_URL:http://localhost:5173/reset-password}
app.mail.password-reset-token-ttl-minutes=15
app.mail.password-reset-resend-cooldown-seconds=60

# Google OAuth 登入（見 docs/google-oauth-design-notes.md）
# app.oauth.google.enabled=false 時前端隱藏 Google 按鈕；本機沒有真實憑證仍可正常開機。
# 停用不是只靠「反正 client id/secret 是 placeholder，Google 會拒絕」這種間接效果——
# GoogleOAuthAuthorizationRequestResolver 會在建立任何 transaction 或呼叫 Google 之前
# 就直接回 null 中止，/oauth2/authorization/google 打下去落地為一般的 404，不會寫入 DB。
# 正式環境宣告啟用（GOOGLE_OAUTH_ENABLED=true）卻沒有真實憑證則視為設定錯誤，交由
# GoogleOAuthStartupValidator 在啟動時 fail fast，而不是讓功能悄悄不能用。
app.oauth.google.enabled=${GOOGLE_OAUTH_ENABLED:false}
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:unset-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:unset-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,email,profile
# 前端 OAuth callback 頁／補資料頁／錯誤頁：Callback 只帶一次性交換碼或非敏感錯誤 reason，
# 絕不帶 JWT／account id／email（見 GoogleOAuthSuccessHandler／FailureHandler）
app.oauth.frontend-success-url=${OAUTH_FRONTEND_SUCCESS_URL:http://localhost:5173/oauth/callback}
app.oauth.frontend-registration-url=${OAUTH_FRONTEND_REGISTRATION_URL:http://localhost:5173/oauth/register}
app.oauth.frontend-link-result-url=${OAUTH_FRONTEND_LINK_RESULT_URL:http://localhost:5173/account/oauth/callback}
app.oauth.frontend-error-url=${OAUTH_FRONTEND_ERROR_URL:http://localhost:5173/login}
app.oauth.transaction-ttl-minutes=10
app.oauth.registration-ticket-ttl-minutes=15
app.oauth.exchange-code-ttl-seconds=90

# 種子管理員（AdminSeedRunner）：這組 email 不存在時自動建立，直接 ACTIVE，
# 解決「第一個管理員沒有人可以審核」的雞生蛋問題。
# 本專題僅在 localhost 本機展示、不會公開部署，預設直接開啟＋帶預設帳密，
# 全新資料庫第一次啟動就自動種出始祖帳號；已存在且資料正確則略過，
# 資料不一致則啟動失敗（見 AdminSeedRunner.run()）。若未來真的要部署到
# 非本機環境，務必用下面的環境變數覆蓋成真正的帳密（或設 SEED_ADMIN_ENABLED=false）。
app.seed.admin-enabled=${SEED_ADMIN_ENABLED:true}
app.seed.admin-email=${SEED_ADMIN_EMAIL:admin@wpgym.local}
app.seed.admin-password=${SEED_ADMIN_PASSWORD:Admin@12345}

# 開發用測試帳號播種（TestDataSeedRunner）：統一各組員本機資料庫的測試帳號，
# 與前端登入頁的測試帳號面板對應。密碼公開已知，正式環境務必設 SEED_TEST_DATA_ENABLED=false
app.seed.test-data-enabled=${SEED_TEST_DATA_ENABLED:true}

# MVC async 請求逾時須大於 GeminiClient 的 120 秒讀逾時（AsyncConfig RestTemplate），
# 否則慢的 AI 呼叫會先被 MVC 中止（AsyncRequestTimeoutException）
spring.mvc.async.request-timeout=130000

# AI 課表生成：實際串接 Gemini（Google AI Studio），非規格書原訂的 OpenAI。
# model 用 -latest 別名而非寫死版本號，避免像 gemini-2.0-flash 那樣哪天被停用。
# 空預設：沒設定金鑰時應用照常啟動，僅 AI 課表功能於呼叫當下回 503（GeminiClient 檢查）
app.ai.gemini.api-key=${GOOGLE_API_KEY:}
app.ai.gemini.model=gemini-flash-lite-latest
app.ai.gemini.base-url=https://generativelanguage.googleapis.com/v1beta

# Cloudinary 連線設定
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.cloudinary.api-key=${CLOUDINARY_API_KEY:}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
