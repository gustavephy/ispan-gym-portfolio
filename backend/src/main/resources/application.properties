spring.application.name=backend

# 資料庫連線設定
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=ispan-proj-gymdb;encrypt=false;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA 設定
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# 篩選唯一索引等 ddl-auto 做不到的設定，已改由 SchemaFixupRunner 在啟動後執行

spring.profiles.active=dev
app.dev-current-user-id=1
# member_id 與 account_id 已脫鉤為各自獨立流水號，兩者不一定同號；
# 沒特別設定時 DevCurrentUserProvider 會直接沿用上面的 app.dev-current-user-id。
app.dev-current-member-id=1

# JWT 設定
# secret 需為 Base64、解碼後至少 32 bytes(256 bits)
# 下面的預設值僅供本機開發，解碼後即 "ispan-gym-local-dev-only-secret-do-not-use-in-prod!"
# 警告：此密鑰已進版控，任何人都能用它偽造任意帳號（含 ADMIN）的 token。
# 正式環境務必設定 JWT_SECRET 環境變數覆蓋，例如：
#   PowerShell> $env:JWT_SECRET=[Convert]::ToBase64String((1..32|%{Get-Random -Max 256}))
app.jwt.secret=${JWT_SECRET:aXNwYW4tZ3ltLWxvY2FsLWRldi1vbmx5LXNlY3JldC1kby1ub3QtdXNlLWluLXByb2Qh}
app.jwt.access-token-ttl=PT2H
app.jwt.issuer=ispan-gym

# CORS 允許的前端來源
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# 綠界 ECPay 金流設定
# merchant-id/hash-key/hash-iv 預設值是綠界官方公開給所有開發者共用的測試商店固定值，非機密。
# 正式環境務必用環境變數覆蓋為正式特店的值。
# 本機沒有對外公開的 URL，綠界無法主動打 return-url；開發階段改用 Postman 手動模擬通知，
# 打 /api/payments/ecpay/notify 驗證簽章與履約邏輯，之後要做真正端對端測試再用 ngrok 之類的工具覆蓋這個值。
# 註：綠界公開好幾組測試特店，後台模擬 3D 驗證（簡訊 OTP 1234）的行為不完全一樣；
# 這組 3002607 已實際驗證過 OTP 1234 可以正常過。
app.ecpay.merchant-id=${ECPAY_MERCHANT_ID:3002607}
app.ecpay.hash-key=${ECPAY_HASH_KEY:pwFHCqoQZGmho4w6}
app.ecpay.hash-iv=${ECPAY_HASH_IV:EkRm7iFT261dpevs}
app.ecpay.action-url=${ECPAY_ACTION_URL:https://payment-stage.ecpay.com.tw/Cashier/AioCheckOut/V5}
app.ecpay.return-url=${ECPAY_RETURN_URL:http://localhost:8080/api/payments/ecpay/notify}
app.ecpay.client-back-url=${ECPAY_CLIENT_BACK_URL:http://localhost:5173/orders}

# Email 寄送設定（註冊驗證信用，密碼為 Gmail 應用程式密碼）
spring.mail.host=smtp.gmail.com
spring.mail.port=587
# 未設定環境變數時仍可啟動應用，僅寄信功能不可用
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# 註冊 Email 驗證
app.mail.verification-base-url=${APP_VERIFICATION_BASE_URL:http://localhost:8080/api/accounts/verify-email}
app.mail.verification-token-ttl-hours=24

# AI 課表生成：實際串接 Gemini（Google AI Studio），非規格書原訂的 OpenAI。
# model 用 -latest 別名而非寫死版本號，避免像 gemini-2.0-flash 那樣哪天被停用。
app.ai.gemini.api-key=${GOOGLE_API_KEY}
app.ai.gemini.model=gemini-flash-latest
app.ai.gemini.base-url=https://generativelanguage.googleapis.com/v1beta
