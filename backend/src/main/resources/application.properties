spring.application.name=backend

# 資料庫連線設定
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=ispan-proj-gymdb;encrypt=false;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA 設定
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# 篩選唯一索引等 ddl-auto 做不到的設定，已改由 SchemaFixupRunner 在啟動後執行

# JWT 設定
# secret 需為 Base64、解碼後至少 32 bytes(256 bits)；正式環境請改用環境變數注入
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-ttl=PT2H
app.jwt.issuer=ispan-gym

# CORS 允許的前端來源
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000
