spring.application.name=backend

# 資料庫連線設定
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=ispan-proj-gymdb;encrypt=false;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA 設定
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# 啟動時執行 data.sql（篩選唯一索引等 ddl-auto 做不到的設定）
# always：非嵌入式資料庫預設不跑 data.sql，必須明確開啟
# defer：讓 data.sql 在 Hibernate 建完表「之後」才執行
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
