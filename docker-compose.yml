services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: gym-db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${DB_PASSWORD:-P@ssw0rd}
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gym-backend
    ports:
      - "8080:8080"
    environment:
      - DB_URL=jdbc:sqlserver://db:1433;databaseName=ispan-proj-gymdb;encrypt=false;trustServerCertificate=true
      - DB_USERNAME=sa
      - DB_PASSWORD=${DB_PASSWORD:-P@ssw0rd}
      - JWT_SECRET=${JWT_SECRET:-aXNwYW4tZ3ltLWxvY2FsLWRldi1vbmx5LXNlY3JldC1kby1ub3QtdXNlLWluLXByb2Qh}
      - ECPAY_RETURN_URL=${ECPAY_RETURN_URL:-http://localhost:8080/api/payments/ecpay/notify}
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gym-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mssql-data:
