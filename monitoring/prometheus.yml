# Prometheus 是 pull 模型：由它主動來抓後端的 /actuator/prometheus，
# 應用程式端不需要知道監控系統的存在（跟自製監控頁的差異之一）。
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: gym-backend
    metrics_path: /actuator/prometheus
    static_configs:
      # 兩個目標對應兩種跑法，同一時間只會有一個活著（另一個顯示 down 屬正常）：
      # - host.docker.internal:8081：開發模式，後端跑在宿主機（管理埠 8081）
      # - backend:8081：全容器模式（根目錄 docker-compose include 本檔，同網路互通）
      - targets: ["host.docker.internal:8081", "backend:8081"]
